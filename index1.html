<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透明中心布局界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: transparent;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-areas: 
                "top-bar top-bar top-bar"
                "left-panel center right-panel";
            grid-template-rows: 60px 1fr;
            grid-template-columns: 200px 1fr 200px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        .top-bar {
            grid-area: top-bar;
            background: rgba(50, 50, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .left-panel {
            grid-area: left-panel;
            background: rgba(50, 50, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
        }

        .right-panel {
            grid-area: right-panel;
            background: rgba(50, 50, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
        }

        .center {
            grid-area: center;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            text-align: center;
        }

        .btn {
            background: rgba(80, 80, 80, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(5px);
            min-width: 80px;
            text-align: center;
        }

        .btn:hover {
            background: rgba(100, 100, 100, 0.95);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .side-btn {
            width: 100%;
            padding: 12px 15px;
            font-size: 13px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                grid-template-areas: 
                    "top-bar"
                    "center"
                    "bottom-controls";
                grid-template-rows: 60px 1fr 120px;
                grid-template-columns: 1fr;
            }

            .left-panel, .right-panel {
                display: none;
            }

            .bottom-controls {
                grid-area: bottom-controls;
                background: rgba(50, 50, 50, 0.9);
                backdrop-filter: blur(10px);
                border-radius: 10px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                padding: 15px;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 5px;
                gap: 5px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                min-width: 60px;
            }
        }

        /* 大屏幕优化 */
        @media (min-width: 1200px) {
            .container {
                grid-template-columns: 250px 1fr 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部按钮栏 -->
        <div class="top-bar">
            <button class="btn" onclick="handleTopAction('home')">首页</button>
            <button class="btn" onclick="handleTopAction('settings')">设置</button>
            <button class="btn" onclick="handleTopAction('help')">帮助</button>
            <button class="btn" onclick="handleTopAction('about')">关于</button>
            <button class="btn" onclick="handleTopAction('logout')">退出</button>
        </div>

        <!-- 左侧按钮面板 -->
        <div class="left-panel">
            <button class="btn side-btn" onclick="handleLeftAction('file')">文件管理</button>
            <button class="btn side-btn" onclick="handleLeftAction('edit')">编辑工具</button>
            <button class="btn side-btn" onclick="handleLeftAction('view')">视图选项</button>
            <button class="btn side-btn" onclick="handleLeftAction('search')">搜索功能</button>
            <button class="btn side-btn" onclick="handleLeftAction('filter')">筛选器</button>
            <button class="btn side-btn" onclick="handleLeftAction('export')">导出数据</button>
        </div>

        <!-- 右侧按钮面板 -->
        <div class="right-panel">
            <button class="btn side-btn" onclick="handleRightAction('properties')">属性面板</button>
            <button class="btn side-btn" onclick="handleRightAction('layers')">图层管理</button>
            <button class="btn side-btn" onclick="handleRightAction('history')">历史记录</button>
            <button class="btn side-btn" onclick="handleRightAction('tools')">工具箱</button>
            <button class="btn side-btn" onclick="handleRightAction('preview')">预览模式</button>
            <button class="btn side-btn" onclick="handleRightAction('share')">分享选项</button>
        </div>

        <!-- 移动端底部控制栏 -->
        <div class="bottom-controls" style="display: none;">
            <button class="btn" onclick="handleMobileAction('menu')">菜单</button>
            <button class="btn" onclick="handleMobileAction('tools')">工具</button>
            <button class="btn" onclick="handleMobileAction('settings')">设置</button>
        </div>
    </div>

    <script>
        // 顶部按钮事件处理
        function handleTopAction(action) {
            console.log('顶部操作:', action);
            // 这里可以添加具体的功能实现
            switch(action) {
                case 'home':
                    alert('返回首页');
                    break;
                case 'settings':
                    alert('打开设置');
                    break;
                case 'help':
                    alert('显示帮助');
                    break;
                case 'about':
                    alert('关于信息');
                    break;
                case 'logout':
                    if(confirm('确定要退出吗？')) {
                        alert('已退出');
                    }
                    break;
            }
        }

        // 左侧按钮事件处理
        function handleLeftAction(action) {
            console.log('左侧操作:', action);
            alert('左侧功能: ' + action);
        }

        // 右侧按钮事件处理
        function handleRightAction(action) {
            console.log('右侧操作:', action);
            alert('右侧功能: ' + action);
        }

        // 移动端按钮事件处理
        function handleMobileAction(action) {
            console.log('移动端操作:', action);
            alert('移动端功能: ' + action);
        }

        // 响应式显示处理
        function handleResize() {
            const bottomControls = document.querySelector('.bottom-controls');
            if (window.innerWidth <= 768) {
                bottomControls.style.display = 'flex';
            } else {
                bottomControls.style.display = 'none';
            }
        }

        // 页面加载时和窗口大小改变时执行
        window.addEventListener('load', handleResize);
        window.addEventListener('resize', handleResize);

        // 中间区域点击事件（可选）
        document.querySelector('.center').addEventListener('click', function() {
            console.log('点击了中间透明区域');
        });
    </script>
</body>
</html>
